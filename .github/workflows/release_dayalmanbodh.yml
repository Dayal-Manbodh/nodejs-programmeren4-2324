# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - DayalManbodh

on:
    push:
        branches:
            - release
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Node.js version
              uses: actions/setup-node@v3
              with:
                  node-version: '20.x'

            - name: npm install, build, and test
              run: |
                  npm install
                  npm run build --if-present
                  npm run test --if-present

            - name: Zip artifact for deployment
              run: zip release.zip ./* -r

            - name: Upload artifact for deployment job
              uses: actions/upload-artifact@v3
              with:
                  name: node-app
                  path: release.zip
    test:
        runs-on: ubuntu-latest
        needs: build
        env:
            MYSQL_ROOT_PASSWORD: root
            DB_HOST: 127.0.0.1
            DB_PORT: 3306
            DB_NAME: share_a_meal
            DB_USER: root
            DB_PASSWORD: root
            JWT_KEY: supersecretkey

        steps:
            - name: Download artifact from build job
              uses: actions/download-artifact@v3
              with:
                  name: node-app

            - name: Unzip artifact for tests
              run: unzip release.zip

            - name: Install MySQL client
              run: sudo apt-get install -y mysql-client

            - name: Start MySQL service
              run: sudo systemctl start mysql

            - name: Wait for MySQL to start
              run: sudo systemctl status mysql --no-pager

            - name: Create MySQL database
              run: |
                  mysql -h 127.0.0.1 -uroot -p${{ env.MYSQL_ROOT_PASSWORD }} -e "CREATE DATABASE IF NOT EXISTS ${{ env.DB_NAME }};"

            - name: Import MySQL schema and data
              run: |
                  mysql -h 127.0.0.1 -uroot -p${{ env.MYSQL_ROOT_PASSWORD }} ${{ env.DB_NAME }} < share-a-meal.sql

            - name: Show MySQL tables
              run: |
                  mysql -h 127.0.0.1 -uroot -p${{ env.MYSQL_ROOT_PASSWORD }} ${{ env.DB_NAME }} -e "SHOW TABLES;"

            - name: Run npm test
              run: |
                  npm test -- --DB_PASSWORD $MYSQL_ROOT_PASSWORD --DB_USER root --DB_NAME $DB_NAME --DB_PORT $DB_PORT

    deploy:
        runs-on: ubuntu-latest
        needs: test
        environment:
            name: 'Production'
            url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
        permissions:
            id-token: write #This is required for requesting the JWT

        steps:
            - name: Download artifact from build job
              uses: actions/download-artifact@v3
              with:
                  name: node-app

            - name: Unzip artifact for deployment
              run: unzip release.zip

            - name: Login to Azure
              uses: azure/login@v1
              with:
                  client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_12FAF168DF914D72B3C70651ED39C700 }}
                  tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_74B716B1BE6C402BA3A4E517E4945F77 }}
                  subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FD4808CA14F24EF19511B6D59BDE05E5 }}

            - name: 'Deploy to Azure Web App'
              id: deploy-to-webapp
              uses: azure/webapps-deploy@v2
              with:
                  app-name: 'DayalManbodh'
                  slot-name: 'Production'
                  package: .
